<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title data-i18n="lobby.title">多人聯機 - Tragedy Looper</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="tl-header">
    <div class="brand"><img src="assets/logo/logo.png" alt="Tragedy Looper"><span data-i18n="lobby.title">多人聯機大廳</span></div>
    <span class="hint" data-i18n="lobby.hint">房間最多 4 名玩家 · 1 人可獨占全部英雄（調試/驗證劇本）</span>
    <div class="spacer"></div>
    <select id="lang-select" class="tl-lang" title="Language"></select>
    <button class="tl-btn" id="lb-back" data-i18n="lobby.back">返回首頁</button>
  </div>

  <div class="lobby-wrap">
    <div class="lobby-grid">
      <div class="tl-panel" id="lobby-entry">
        <h3 data-i18n="lobby.enter">進入大廳</h3>
        <div class="tl-field" style="margin-bottom:12px;">
          <label data-i18n="lobby.name">玩家名稱</label>
          <input type="text" id="lb-name" maxlength="12" data-i18n-ph="lobby.namePh" placeholder="輸入名稱…">
        </div>
        <div class="tl-field" style="margin-bottom:16px;">
          <label data-i18n="lobby.avatar">頭像（隨機分配，可重擲）</label>
          <div style="display:flex;align-items:center;gap:12px;">
            <img id="lb-avatar-img" class="avatar-big" alt="">
            <button class="tl-btn" id="lb-reroll" data-i18n="lobby.reroll">🎲 換一個</button>
          </div>
        </div>
        <div class="tl-field" style="margin-bottom:14px;">
          <label data-i18n="lobby.code">房間代碼（加入時填寫）</label>
          <input type="text" id="lb-code" maxlength="4" data-i18n-ph="lobby.codePh" placeholder="例如 ABCD" style="text-transform:uppercase;">
        </div>
        <div class="lobby-btns">
          <button class="tl-btn tl-btn-primary" id="lb-create" data-i18n="lobby.create">建立房間</button>
          <button class="tl-btn" id="lb-join" data-i18n="lobby.join">加入房間</button>
        </div>
        <div class="lb-hint" data-i18n="lobby.hintText">💡 本頁需由多人伺服器提供：請先雙擊 <b>start_server.bat</b>
          （專案根目錄 <b>D:\Rooper</b> 或 <b>game</b> 資料夾內都有，也可直接雙擊 <b>game\start.bat</b>），
          然後用瀏覽器開啟 <b>http://localhost:8360</b> 進入大廳，否則無法連線。</div>
        <div id="lb-error" style="color:var(--red-soft);margin-top:10px;font-size:14px;"></div>
      </div>

      <div class="tl-panel" id="lobby-room" style="display:none;">
        <h3>房間 <small id="lb-room-hint"></small></h3>
        <div class="room-code-row">
          <span data-i18n="lobby.roomCode">房間代碼</span>
          <b id="lb-roomcode"></b>
          <button class="tl-btn" id="lb-copy" data-i18n="lobby.copy">複製</button>
        </div>
        <div class="lobby-cols">
          <div style="flex:1;min-width:0;">
            <h4 class="lobby-sec" data-i18n="lobby.players">玩家</h4>
            <div id="lb-players" class="lb-players"></div>
            <h4 class="lobby-sec"><span data-i18n="lobby.assign">英雄分配</span> <small id="lb-assign-hint" style="color:var(--text-faint);font-weight:normal;"></small></h4>
            <div id="lb-assign" class="lb-assign"></div>
            <div id="lb-script" class="lb-script"></div>
            <button class="tl-btn tl-btn-primary" id="lb-start" style="margin-top:12px;" data-i18n="lobby.start">開始遊戲</button>
          </div>
          <div class="lb-chat-box">
            <h4 class="lobby-sec" data-i18n="lobby.chat">對話</h4>
            <div id="lb-chat" class="chat-log"></div>
            <div class="chat-input-row">
              <input type="text" id="lb-chat-input" maxlength="300" data-i18n-ph="lobby.chatInput" placeholder="輸入訊息…">
              <button class="tl-btn" id="lb-chat-send" data-i18n="lobby.send">送出</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data/characters.js"></script>
  <script src="js/data/roles.js"></script>
  <script src="js/data/plots.js"></script>
  <script src="js/data/incidents.js"></script>
  <script src="js/data/cards.js"></script>
  <script src="js/data/modules.js"></script>
  <script src="js/data/presets.js"></script>
  <script src="js/data/i18n.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/ui/common.js"></script>
  <script src="js/ui/net.js"></script>
  <script src="js/ui/lobby.js"></script>
  <script>
    TL.I18N.bindSelect(document.getElementById("lang-select"), function () {
      try { window.__tlLobbyRefresh && window.__tlLobbyRefresh(); } catch (e) {}
    });
  </script>
</body>
</html>
